# Output descriptors and miniscript, mutated: the checksum, BIP380's key
# expressions, BIP379's language and the witness that satisfies one. The largest
# surface added to btclib, where this code was written, since
# btclib-org/btclib#219 was opened, and the one whose answers a caller cannot
# check by eye -- a miniscript satisfaction is a choice of branch, a set of type
# properties and a witness whose size decides a fee, none of which a wrong bound
# announces. This asks whether tests/descriptors would notice if a line of the
# package's modules were wrong.
#
# The profile is split into shards, one session and one job each, because a
# whole session of it does not fit in one hosted job; the comment on
# `profiles` in .github/workflows/mutation.yml says how they are sized. This
# file is the shard of every module of the package but miniscript.py and
# descriptors.py, which miniscript-*.toml and descriptors-py-*.toml split by
# operator. Those files copy this one's test-command and timeout.
#
# A numbered shard's filter is a negative lookahead: cr-filter-operators
# skips a mutant whose operator name the pattern matches at its start, and
# `(?!A|B)` matches every name that starts with neither A nor B, so the shard
# runs A and B. A module's numbered shards run disjoint sets of operators, and
# its `-rest` shard skips exactly the operators they run, so each mutant of the
# package is judged by one shard, those of an operator a cosmic-ray release
# adds included. In a shard's counts line, skipped counts the mutants of its
# module that another shard judges. tests/mutation_shards_test.py checks the
# copied settings and that each mutant has one shard.

[cosmic-ray]
# the package, `__init__.py` included, and naming the directory is what keeps
# a module added to it from being left out in silence
module-path = "src/bip32_descriptors/descriptors"

# tests/descriptors alone, the directory of these modules' tests and part of
# the suite: CONTRIBUTING.md's *Mutation testing* says what a survivor then
# needs. This lists the lines of the package the command leaves to the rest
# of the suite, `--cov-reset` dropping the bare `--cov` of addopts:
#
#   uv run pytest --cov-reset --cov=src/bip32_descriptors/descriptors \
#       tests/descriptors
#
# btclib-wallet's wallet.toml mutates the wallet's side of what a wallet asks a
# descriptor for.
#
# -n0 and -p no:randomly for the reasons btclib's sig_hash.toml gives: xdist's
# worker per core is startup paid once per mutant, and with -x a shuffled
# collection order makes both the killing test and the runtime
# irreproducible. Coverage runs and fails no mutant, same file
test-command = "python -m pytest -x -q -n0 -p no:randomly tests/descriptors"

# seconds of wall clock, wide for the reason btclib's sig_hash.toml measures --
# a timeout is answered KILLED, so a tight one turns a slow mutant on a loaded
# machine into a kill nobody earned. This scope has somewhere for one to hide,
# unlike the parsers: satisfaction and type inference walk a fragment tree, and
# `miniscript.py` carries the ops, stack and script-size bounds that stop a
# `thresh` or a nested `andor` from expanding without end, so a mutant that
# widens one of those is what the slack is for
timeout = 300

# the two modules the other shard files split
excluded-modules = [
    "src/bip32_descriptors/descriptors/descriptors.py",
    "src/bip32_descriptors/descriptors/miniscript.py",
]

# No operator filter here, and that is a decision rather than an omission:
# btclib's parsers.toml excludes `ReplaceBinaryOperator_BitOr_.*` because every
# `|` in its scope is an unevaluated annotation under `from __future__ import
# annotations`, and here most of them are arithmetic. `miniscript.py` computes a
# fragment's type properties as a set algebra over one-letter properties --
# `_if(_has(x, "B"), _t("W")) | (x & _t("ghijkudfems"))` and some seventy lines
# like it -- so a `|` turned into `^` or `&` there is exactly the question this
# profile exists to ask. The claim is a grep, a line number here rotting on the
# next insertion above it:
#
#   grep -c ' | ' src/bip32_descriptors/descriptors/*.py
#
# The annotation half survives instead, and is the class fetch.toml
# documents at length: unevaluated, unkillable, and not a hole. What the
# first session says about the trade is that some of the `|` mutants it
# ran were *killed*, which no annotation's ever is.
#
# The survivors triaged below are read off the `descriptors-survivors.txt`
# the workflow uploads, at btclib's run 34833390559, except where a
# paragraph names its own run.
#
# This file triages the non-annotation survivors of `miniscript.py`, and
# those of descriptors.py and key_expression.py that the mutation run
# https://github.com/btclib-org/bip32-descriptors/actions/runs/41250474104
# left on lines that still exist, and they split into these kinds:
#
# - the type-property algebra, which is what this scope was written to
#   ask about -- and the class is smaller than the survivor list makes it
#   look. BIP379's composition rules are a chain of terms, and almost
#   every term selects letters no other term contributes. A `|` turned
#   into `^` binds tighter than the `|` around it, so it joins the term
#   before it to its own, and two terms with no letter in common have the
#   same union and symmetric difference. Read on the code, these are
#   equivalent that way: in `d:`, its "o" and "e" terms; in `v:`,
#   `x & _t("ghijkzonms")` and `_t("fx")`; in `and_v`, its "s" and "f"
#   terms; in `and_b`, `_t("ux")` and the timelocks, which are letters of
#   "ghijk"; in `or_c`, its "o" and "m" terms; in `andor`, its "BKV" and
#   "z" terms, and its "m" and "s" terms.
#
#   These operators of these rules are equivalent for reasons of their
#   own. `_wrapper_properties`' `fragment == "d:"` weakened to `<=`: "a:"
#   and "c:" are tested before it, and the other wrappers sort after
#   "d:". And `and_b`'s "o" term, `(x | y) & _t("o")` narrowed to
#   `(x & y) & _t("o")`: an `and_b` has a type only where Y is a "W",
#   which only `a:` and `s:` make, and neither makes it "z" or "o". So
#   where the term applies, X is the one that is "z", and no rule makes a
#   fragment both "z" and "o": neither form gives an "o". The other
#   survivors of these rules in the mutation run
#   https://github.com/btclib-org/bip32-descriptors/actions/runs/41250474104
#   die in tests/descriptors/type_rules_test.py (issue
#   btclib-org/bip32-descriptors#41).
#
#   Of btclib's run, the rest combine the *operands*: the timelocks of a
#   conjunction and of a disjunction, `(x | y) & _t("ghij")`, and `or_b`'s
#   and `or_i`'s non-malleability, `_has(x | y, "s")`. A letter both
#   branches carry is a letter the composite keeps only if the rule is a
#   union, and `test_a_composite_inherits_a_property_from_either_branch`
#   in tests/descriptors/miniscript_test.py asserts the exact property set
#   of the four shortest fragments that show it -- two `older()` branches
#   for the timelock, two signed branches for the "m". All four mutants
#   are dead now, and the assertions are on the properties themselves
#   rather than on something downstream of them.
# - the sizes: `_TX_BODY_LEEWAY_WEIGHT`'s summands rearrange freely, and
#   the stack-limit term beside it takes `^` for `+`. A wrong size here
#   is a wrong fee estimate rather than an invalid spend, which is why
#   nothing louder catches it. `_decomposed`'s push-prefix width,
#   `1 + 2 ** (op_code - 76)`, is the script decoder's, below.
#
#   Read off the mutation run
#   https://github.com/btclib-org/bip32-descriptors/actions/runs/41250474104
#   (issue btclib-org/bip32-descriptors#41), the survivors of the sizes,
#   the witness and stack bounds and the `multi_a()` key count that change
#   an answer die in tests/descriptors/resource_bounds_test.py. These
#   operators are equivalent:
#   - `_MAX_TAPSCRIPT_SAT_SIZE`'s `var_int_serialize(33 + 32 * 128)` turned
#     into `34 + 32 * 128`: only its length is read, and 4129 and 4130
#     both take three bytes.
#   - `_computed_script_size`'s `node.subs[0]` turned into `node.subs[-1]`
#     for a `v:`, which has one subexpression.
#   - `_NOP = _Trace(0, 0)` turned into `_Trace(0, -1)`: `_NOP` is only
#     ever the second operand of `_concat`, after `_PUSH` or
#     `_EQUALVERIFY`, and the peak `_concat` then answers is the larger of
#     `_NOP`'s and the first operand's, which is 0 or 2.
#   - `_pub_key_size`'s `context == TAPSCRIPT` weakened to `>=`: a node's
#     context is "P2WSH" or "tapscript", `_assert_shape` refusing any
#     other, and "P2WSH" sorts before "tapscript".
#   - `_leaf_witness`'s `1 + 32` for a hash preimage turned into `1 | 32`,
#     which is 33 too.
# - the fragment dispatch, weakened from `==` to `>=` at several
#   dispatch points: equivalent wherever the fragment compared is the
#   alphabetical extreme of the closed set it comes from, which is the
#   class btclib's bms.toml states, and worth a look one by one rather than in
#   bulk.
# - `_thresh_input`'s `count == node.threshold` and `_thresh_ops`' and
#   `_thresh_witness`' `reached[1]`/`reached[-1]`: what a `thresh` walk
#   builds. They want a satisfaction with more satisfiable branches than
#   the quorum needs, which is where choosing exactly `threshold` of them
#   is what makes the witness non-malleable.
# - the satisfier's choices, read off the mutation run
#   https://github.com/btclib-org/bip32-descriptors/actions/runs/41250474104
#   (issue btclib-org/bip32-descriptors#41). `satisfy`'s `index: int = 0`
#   default, which wants a ranged key, `_element`'s length prefix and
#   `_better`'s size comparison die in
#   tests/descriptors/satisfier_choice_test.py. These operators are
#   equivalent:
#   - `_better`'s `first.malleable != second.malleable` turned into
#     `is not`: every `malleable` is a bool, and `True` and `False` are
#     the only two.
#   - `_or_input`'s `fragment == "or_b"` weakened to `<=`: it is reached
#     for "or_b", "or_c", "or_d" and "or_i" only, and "or_b" sorts first.
# - the defaults of descriptors.py and of miniscript.py's
#   `SpendContext`, and the refusal beside one, read off the mutation run
#   https://github.com/btclib-org/bip32-descriptors/actions/runs/41250474104
#   (issue btclib-org/bip32-descriptors#41): the `index` of
#   `Descriptor.expand` and the `multipath_index` of
#   `wallet_policy_descriptor`, both 0, and `_resolved_placeholder`'s
#   `match[0]`, the placeholder it names when it refuses one out of
#   range. Each dies in tests/descriptors/defaults_test.py, and so does
#   `SpendContext`'s `sequence: int = 0` turned into -1, a mutant the
#   run did not sample.
# - the script inference in descriptors.py, Core's `Solver`,
#   `MatchMultisig` and `MatchMultiA` beside it, read off the mutation run
#   https://github.com/btclib-org/bip32-descriptors/actions/runs/41250474104
#   (issue btclib-org/bip32-descriptors#41).
#   tests/descriptors/infer_match_test.py kills the survivors that change
#   an answer. These operators are equivalent:
#   - `_sec_size`'s `return -1` for an empty key turned into `return 1`:
#     every caller compares the size with the key's length, which is 0,
#     and neither -1 nor 1 is.
#   - `_multi_a`'s first `script[0] != _X_ONLY_SIZE` weakened to `<`: its
#     loop reads `script[0]` again and refuses anything but 32, and where
#     the loop does not run no key is read, and the answer is None too.
#   - `_multi_a`'s `script[position] != _X_ONLY_SIZE` turned into
#     `is not`: a byte of a script is an int from 0 to 255, and CPython
#     and PyPy both answer `is` as `==` on those.
#   - `_solved`'s `first == b"\x00"` weakened to `<=`: `first` is one byte
#     there, the script being at least four, and no other byte sorts at
#     or below it.
#   - `_inferred`'s `data[0]` turned into `data[-1]` for a "pubkey", whose
#     data is the one key.
#   - `_inferred`'s `kind == "witness_v0_keyhash"` weakened to `>=`: the
#     kinds `_solved` answers that sort after it are
#     "witness_v0_scripthash" and "witness_v1_taproot", whose 32-byte
#     programs are never a key of `by_hash`, which holds 20-byte hashes.
# - the reading of an expression back from its text and from its script
#   in miniscript.py -- `_read_wrappers` of the parser, and the script
#   decoder behind `from_script` and `reads_back` -- read off the
#   mutation run
#   https://github.com/btclib-org/bip32-descriptors/actions/runs/41250474104
#   (issue btclib-org/bip32-descriptors#41).
#   tests/descriptors/script_decoder_test.py kills the survivors that
#   change an answer: `_decomposed`'s push-prefix width and its bound at
#   OP_PUSHDATA4, `_Decoder._key`'s count of the op codes a `pk_h()`
#   needs, `_combinator`'s test for OP_ENDIF, `_thresh_end`'s slice of
#   its branches, and the type check in `decode`'s loop, which names the
#   innermost fragment without a type. These operators are equivalent:
#   - `_op`'s `BYTE_FROM_OP_CODE_NAME[name][0]` turned into `[-1]`: every
#     value of that table is one byte.
#   - `_decomposed`'s `position + 1 < len(spans)` turned into `!=`:
#     `position` enumerates `spans`, so `position + 1` is never above
#     `len(spans)`.
#   - a number of the states `_read_wrappers` and `_Decoder._expect`
#     stack, or of the `_W_EXPR` `_thresh_branch` stacks, changed: only
#     the states of a `thresh()` read their two numbers, and none of
#     these is one.
#   - `_Decoder._key`'s `self._op_code(4) == _OP_DUP` turned into `is`:
#     an op code is an int from 0 to 255, and CPython and PyPy both
#     answer `is` as `==` on those.
#   - `_Decoder._multi_a`'s `self._data(offset + 1)` turned into
#     `offset | 1`: `offset` starts at 2 and grows by 2, so it is even.
#   - `reads_back`'s `node.script() == script` weakened to `>=`: the two
#     differ only on a script `from_script` accepts whose node writes
#     other bytes, sorting after it. That is the round trip `reads_back`
#     checks, not shown here for every script: the mutant lives only
#     while the decoder has no such defect.
# - the removal of an `@override` mark, which the mutation run
#   https://github.com/btclib-org/bip32-descriptors/actions/runs/41250474104
#   (issue btclib-org/bip32-descriptors#41) let live wherever it sampled
#   one. Any such removal is equivalent: the decorator only sets the
#   method's `__override__`, which nothing in the tree reads, and the
#   method still overrides a method of a base class, `object` and `list`
#   included. The lint gate tells instead: mypy's `explicit-override`,
#   which pyproject.toml enables, refuses the removal of every mark in
#   this scope.
# - the rest of the mutation run
#   https://github.com/btclib-org/bip32-descriptors/actions/runs/41250474104
#   (issue btclib-org/bip32-descriptors#41). These die under the
#   profile's command: `__descsum_expand`'s `groups[0] * 3 + groups[1]`
#   in tests/descriptors/descriptors_test.py; `_read_fragment`'s
#   `pos + 1` in tests/descriptors/miniscript_fallback_test.py; and in
#   tests/descriptors/miniscript_test.py, `context == TAPSCRIPT` turned
#   into `is` in `_signature_size`, `Miniscript._assert_keys` and `_sec`,
#   `_decomposed`'s `spans[-1][2] == len(script)` and
#   `_Decoder._combinator`'s `op_code == _OP_EQUAL` weakened to `<=`,
#   `_binary_ops`' `fragment == "or_i"` weakened to `<=`, `_better`'s
#   `malleable=True` for two unsigned stacks, and `_thresh_input`'s
#   `malleable=True` on an overcomplete dissatisfaction, without which
#   an estimate takes that stack, the larger one. These operators are
#   equivalent:
#   - `_derived_origin`'s `key.wildcard + index` turned into `^`: a
#     wildcard is 0 or 2**31, and each caller refuses an index outside
#     0 to 2**31 - 1 before, by `_assert_index_range` or by
#     `KeyExpression.sec`, so the two never share a bit.
#   - `_assert_multi_size`'s `size > MAX_SCRIPT_ELEMENT_SIZE` weakened to
#     `>=`: the size is 3 plus 34 or 66 for each key, so it is odd, and
#     the bound is 520.
#   - key_expression.py's `_origin_and_rest`'s `end < 0` turned into
#     `end < 1`: the expression starts with "[", so a "]" is found at 1
#     or later.
#   - `Miniscript._assert_keys`' `!=` between its two context tests
#     turned into `is not`: both sides are bools.
#   - `max_witness_stack`'s index 0 turned into 1: the estimate reads only
#     the lengths of what it builds, and a key's length does not depend
#     on the index it is derived at. The two differ only where one index
#     derives BIP32's invalid child, which BIP32 puts below 1 in 2**127
#     and no test can find.
#   - `_fragment_script`'s `subs[0]` for a `v:` turned into `subs[-1]`:
#     a `v:` has one subexpression.
#   - `_KEY_CALLS`' `node.keys[0]` for a `pk_k()` and a `pk_h()` turned
#     into `keys[-1]`, a mutant the run did not sample: `_assert_keys`
#     gives each of the two fragments one key.

# one mutant at a time, in this working tree: see btclib's sig_hash.toml
[cosmic-ray.distributor]
name = "local"
