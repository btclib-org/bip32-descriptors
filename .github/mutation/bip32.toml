# Extended keys, mutated: serialization, the derivation path codec beneath it,
# and the key-origin encoding PSBT carries. A wrong depth, a wrong fingerprint
# or a hardened-index bit read the wrong way round is exactly the class of
# boundary btclib-org/btclib#219 and btclib-org/btclib#327 ask mutation testing
# to check for -- every line runs under the existing vectors, and this asks
# whether the suite would notice one of them being wrong.

[cosmic-ray]
module-path = [
    "src/bip32_descriptors/bip32/bip32.py",
    "src/bip32_descriptors/bip32/key_origin.py",
    "src/bip32_descriptors/bip32/der_path.py",
]

# tests/bip32 alone, part of the suite: CONTRIBUTING.md's *Mutation testing*
# says what a survivor then needs
test-command = "python -m pytest -x -q -n0 -p no:randomly tests/bip32"

timeout = 300

excluded-modules = []

# The `BitOr` exclusion btclib-wallet's wallet.toml explains and btclib's
# parsers.toml argues.
# Measured rather than assumed, as btclib's script.toml's own comment on this
# exclusion asks:
#
#   grep -n ' | ' \
#       src/bip32_descriptors/bip32/bip32.py \
#       src/bip32_descriptors/bip32/key_origin.py \
#       src/bip32_descriptors/bip32/der_path.py
#
# Every hit is an annotation. Confirmed by running the filter itself
# rather than by the grep alone: `cosmic-ray init` over this file
# enumerates more mutants today than the session below ran against, the
# file having grown since, and
# `cosmic_ray.tools.filters.operators_filter` marks a larger share of
# them SKIPPED than the session below found equivalent by inspection --
# the same growth -- leaving the rest for a future session to have an
# opinion about (issue btclib-org/btclib#987).
[cosmic-ray.filters.operators-filter]
exclude-operators = ["core/ReplaceBinaryOperator_BitOr_.*"]

# A sample, read off the `bip32-survivors.txt` the workflow uploads,
# at btclib's run 34833390559. Most survivors are the deferred-annotation
# class fetch.toml documents, the keyword-only `*` to `/` marker
# btclib's sig_hash.toml's docstring already names, or an `is` CPython's
# small-int cache makes indistinguishable from `==`.
#
# The rest are genuine gaps, closed:
#
# - `is_root` was not exercised by any caller, so every operator on its
#   three-way `and` survived together -- depth, index and parent
#   fingerprint each compared, none of the three tested. A valid object
#   can only vary the depth term (`_assert_valid_depth_and_index` ties
#   depth zero to index zero and to a zero fingerprint), so the other two
#   needed `check_validity=False` to isolate at all.
# - `str_from_der_path`'s fingerprint length check was tested short
#   (`!= 8` weakened to `< 8` still refuses six octets) and never long.
#
# The rest are the same shape scattered across other methods -- a
# boundary compared or an argument's default never exercised at the
# value that would tell one operator from another -- each needing its
# own look the way `is_root` did. Sampled as data here rather than
# chased method by method.
#
# A second pass worked through that data, file by file.
#
# `der_path.py`: more real gaps. `steps[0].lower() == "m"` weakened
# to `>=` would strip any step sorting at or after "m" instead of "m"
# alone; the depth-255 boundary a der_path string can carry (`> 255`
# weakened to `> 256`); and the per-element type check inside
# `indexes_from_der_path`'s iterable branch, replaced with a loop over
# nothing, uncaught because every existing iterable vector is already
# all integers.
#
# `key_origin.py`: `BIP32KeyOrigin`'s own `check_validity` default was untested
# on all four of `to_dict`/`from_dict`/`serialize`/`parse`, the same class
# btclib's `block.toml` and btclib's `signatures.toml` already name -- with the
# added wrinkle that `parse` reads its four fingerprint octets structurally
# regardless of check_validity, so the over-long-fingerprint vector that catches
# the other three needed a too-deep der_path instead to reach `assert_valid`'s
# own check for `parse`, and `from_description` needed a too-*short*
# description, `data[:8]` on four hex characters giving a fingerprint only
# `assert_valid` -- not the slice -- refuses. `decode_hd_key_paths`'s `{...} if
# map_ else {}` negated returned `{}` for a populated map, silently dropping
# every entry; nothing had passed it one, only `None` and `{}`.
# `assert_valid_hd_key_paths`'s pub_key length set, `{78, 33, 65}`, had all six
# of its numeric neighbors survive with no vector at any of the three lengths'
# plus-or-minus-one, and its per-entry loop, replaced with one over nothing,
# survived because every existing map has one entry or is invalid in that one.
# `BIP32KeyOrigin`'s `@dataclass(frozen=True)` was untested directly.
#
# `bip32.py`, real gaps beyond `is_root`'s own field-comparison
# survivors closed in the first pass, `is_root` also needing its
# `Eq_LtE` mutations (`self.depth == 0`/`self.index == 0` weakened to
# `<= 0`) closed with a negative case, no existing vector using a
# negative depth or index:
#
# - `is_hardened`'s `>= HARDENED_OFFSET` weakened to `==`, and the same
#   expression inside `__pub_key_path_derivation` and
#   `_derive_from_account`'s branch and address_index checks: every
#   existing hardened index in the test vectors (`0h`, `44h`) lands
#   exactly on the offset, so nothing had ever derived, or refused to
#   derive, past it. `__prv_key_derivation`'s and
#   `pub_key_derivation_tweaks`'s own copies of the same expression
#   were already exercised past the boundary (`463h`, `m/1h`) and did
#   not survive.
# - `_assert_valid_depth_and_index`'s two closed ranges, `0 <= depth <=
#   255` and `0 <= index <= 0xffffffff`, tested short and long on both
#   sides already but never at the top of either range itself.
# - `_assert_valid_key`'s chained `0 < q < secp256k1.n`, which cosmic-ray
#   mutates as two independent comparisons: the left one, `0 < q`
#   weakened to `0 != q`, is equivalent (q is an unsigned parse, never
#   negative, so the two agree everywhere); the right one, `q < n`
#   weakened to `q != n`, is not -- both existing invalid-key vectors
#   put q at 0 and at n exactly, so `q != n` alone already refuses
#   either, and only a scalar strictly above n tells `q < n` apart from
#   it.
# - four prefix-refusal messages -- the private and public key checks in
#   `_assert_valid_key`, `_xpub_from_xprv`'s "not a private key", and
#   `_err_msg` -- all slice one byte, `key[:1].hex()`, widened by
#   `NumberReplacer` to `key[:2]`. Every existing vector matches the
#   message with `pytest.raises(match=...)`, which searches rather than
#   anchors, so a wider slice's hex still contains the narrower one as a
#   leading substring and the widening was never caught; an exact
#   `str(excinfo.value) ==` comparison is what tells them apart.
# - `pub_key_derivation_tweaks`'s `offset.to_bytes(32, ...)` widened to
#   33: the existing test compares the point the tweaks reconstruct,
#   which a leading zero byte does not move, so nothing had checked the
#   tweaks' own length.
# - `_force_version` was entirely unexercised -- no test anywhere passed
#   `derive`'s `forced_version` argument -- so its `in`/`not in` checks
#   negated and its `bytes_from_octets(forced_version, 4)` widened to 5
#   or narrowed to 3 all survived for want of a single call.
# - `b58decode`'s `isinstance(address, str)` negated would strip bytes
#   instead of strings, untested since no vector passes a string with
#   whitespace to strip in the first place.
# - `BIP32KeyData`'s own `check_validity` default, untested on all four
#   of `__init__`/`serialize`/`b58encode`/`parse` the way key_origin.py's
#   was -- a zero depth with a non-zero parent fingerprint serializes
#   structurally fine and is refused only by `assert_valid`'s cross-field
#   check, the one check_validity=False defers at each of the four.
#   `_BIP32KeyData.__init__`'s own copy of the same guard, `if
#   check_validity` negated to `if not check_validity`, needed a direct
#   call: `_derive` only ever builds one from an already-valid key, so
#   nothing through the public API reaches it invalid.
# - `_derive`'s `final_depth > 255`, tested long (256) but not at the
#   boundary itself (255).
# - `derive_from_account`'s `max_index: int = 0xffff` widened to 65536
#   or narrowed to 65534: the *public* function's own default, tested at
#   the boundary. `_derive_from_account`, the private function one layer
#   down, carries an identical-looking default that is equivalent for a
#   different reason below.
#
# Checked and left equivalent:
#
# - `_assert_valid_depth_and_index`'s `parent_fingerprint != b"\x00" * 4`
#   weakened to `>`, and `index != 0` weakened to `>`: a 4-byte value
#   can never sort below all-zero and an index can never be negative
#   (both already checked above this point), so `!=` and the one-sided
#   comparison agree everywhere reachable -- the same bytes-minimum and
#   non-negative-bound reasoning `key_origin.py`'s own first pass used.
# - `is_private`'s `self.key[0] == 0` weakened to `<=`: a byte value is
#   never below zero, so `==` and `<=` coincide.
# - four `key[1:]` reads -- in `_assert_valid_key`, `_xpub_from_xprv`,
#   `_BIP32KeyData.__init__`, and `crack_prv_key` -- widened to `key[0:]`:
#   each is reached only after its own `key[0] != 0` guard (directly, or
#   through `is_private`) has already confirmed that first byte is zero,
#   and a leading zero byte never changes a big-endian integer's value,
#   so the extra byte in the slice is silent.
# - `is_root`'s three-way `and` negated to `or` at either junction: the
#   existing `non_root_depth`/`non_root_index`/`non_root_fingerprint`
#   cases already isolate each term to false while the other two hold,
#   which is exactly what an `and`-to-`or` widening needs a witness
#   against.
# - `RemoveDecorator` on `is_root`'s own `@property`: turns `.is_root`
#   into a bound method, always truthy whether or not the key is root,
#   which the existing `assert not other.is_root` cases already catch
#   (a truthy bound method fails `not`).
# - `RemoveDecorator` on `_BIP32KeyData`'s own `@dataclass(repr=False)`:
#   the class defines its own `__init__`, which a manual `_set_new_
#   attribute`-style check in `dataclasses` never overwrites either way;
#   `repr=False` already means "inherit the parent's", identical with or
#   without the decorator; and the `__eq__` the decorator would add
#   compares `prv_key_int` beside the six inherited fields, but it is a
#   pure function of `key` and `is_private`, values already in that
#   comparison -- two instances equal on the six can never disagree on
#   the one derived from them, so the wider or the narrower `__eq__`
#   never differs in what it answers.
# - `_rootxprv_from_seed`'s `bit_length < 128` and `> 512` widened by one
#   to 127 and 513: `bit_length = len(seed) * 8` is always a multiple of
#   8, so 127 and 513 are values no byte-sized seed can ever produce --
#   every reachable bit_length either both operators accept or both
#   refuse.
# - `_derive_from_account`'s own `max_index: int = 0xffff` default: the
#   public `derive_from_account` above it always passes its own
#   `max_index` down explicitly, so the private function's default is
#   never the value actually used -- an unreachable default, the same
#   class `key_origin.py`'s `_pairs_from_der_path_str` and
#   `_decode_from_bip32_deriv` are.
#
# `__repr__`'s `self.key[:1] == b"\x00"` weakened to `<=` dies in
# tests/bip32/bip32_test.py. The two differ only on an empty key, which
# an instance built with `check_validity=False` can hold: the mutant
# masks its chain code as if the key were private, where the original
# prints it.
#
# Not chased further, the same shape as the first pass's own note: the
# `signed=False` reads and writes across the various `to_bytes`/
# `int.from_bytes` calls in the derivation functions, and the
# public-key-prefix set `{2, 3}`'s own numeric neighbors, both sampled
# rather than exhausted.
#
# `der_path.py` and `key_origin.py` again, read off the mutation run
# https://github.com/btclib-org/bip32-descriptors/actions/runs/42593958370
# (issue btclib-org/bip32-descriptors#41), each survivor run again
# against the whole suite. These die there, in tests outside tests/bip32
# that this profile's command does not run, so a run of it reports them
# alive again:
#
# - `_MAX_DIGITS` raised by one, in tests/descriptors/descriptors_test.py.
# - the keyword-only `*` turned into `/` before `check_validity`, in
#   tests/check_validity_test.py, and before the `bip380_enforced` of
#   `int_from_index_str`, `indexes_from_der_path` and
#   `hardenings_from_der_path`, in tests/bool_parameter_test.py.
#
# Of the rest, `BIP32KeyOrigin.assert_valid`'s `0 <= i` widened to
# `-1 <= i`, `from_description`'s `data[8] != "/"` weakened to `>` and
# its `data[9:]` widened to `data[8:]`, and `assert_valid_hd_key_paths`'
# length comparison turned into `is not` die in
# tests/bip32/key_origin_test.py. These operators are equivalent:
#
# - `_index_and_hardening_from_str`'s `index + (HARDENED_OFFSET if
#   hardening else 0)` turned into `|` or `^`: the line before refuses
#   an index at or above the offset, so its top bit is clear and the
#   three agree.
# - `str_from_index_int`'s `index - HARDENED_OFFSET` turned into `%` or
#   `^`: the index there is at least the offset and at most 0xffffffff,
#   so its top bit is set and the three agree.
# - `_indexes_from_der_path`'s `len(der_path) % 4 != 0` weakened to
#   `> 0`: a remainder by 4 is never negative.
# - the keyword-only `*` turned into `/` in `_index_and_hardening_from_str`,
#   `_pairs_from_der_path_str` and `_pairs_from_der_path`: the three are
#   private, and every call passes the path, and `skip_m` where there is
#   one, by position and `bip380_enforced` by keyword, which both
#   signatures accept.
# - `assert_valid_hd_key_paths`' `len(values) > len(serializations)`
#   turned into `!=`: the set of the values' serializations is never
#   larger than the values.
# - `assert_valid_hd_key_paths`' `len(pub_key) != 78` weakened to `<`:
#   the check before it has refused every length but 78, 33 and 65.
# - `RemoveDecorator` on `BIP32KeyOrigin.__hash__`'s `@override`: it
#   only marks the method, and nothing in the package reads the mark.
#
# `bip32.py` from the same run, its first part: `BIP32KeyData`, the
# decoding cache and the validity checks it calls, each survivor again
# run against the whole suite. These die there, outside tests/bip32:
#
# - the keyword-only `*` turned into `/` before `check_validity` in
#   `serialize`, `b58encode`, `parse` and `b58decode`, in
#   tests/check_validity_test.py.
# - `parse`'s `len(key_bin) != _REQUIRED_LENGTH` weakened to `>`, in
#   tests/fuzz_test.py.
#
# `is_root`'s `parent_fingerprint == b"\x00" * 4` weakened to `<=` dies
# in tests/bip32/bip32_test.py. These operators are equivalent, where the
# paragraphs above have not named them:
#
# - `@functools.lru_cache(maxsize=2048)` on `_cached_base58_decode`
#   removed, or its size moved by one: the function returns the bytes
#   `b58decode_check` does, a refusal is raised and never cached, and
#   nothing reads the cache, so what changes is how often it decodes.
# - `_assert_valid_depth_and_index`'s `depth == 0` weakened to `<= 0`: a
#   negative depth is refused by the check before it.
# - `_assert_valid_key`'s `key[0] != 0` weakened to `> 0`: a byte is
#   never below zero.
# - `BIP32KeyData`'s `@dataclass(init=False)` turned into `init=True`:
#   the class defines its own `__init__`, which `dataclass` keeps.
# - `RemoveDecorator` on `BIP32KeyData.__repr__`'s `@override`: nothing
#   in the package reads the mark.
# - `assert_valid`'s `len(value) != size` and `parse`'s
#   `len(key_bin) != _REQUIRED_LENGTH` turned into `is not`: the two
#   differ only where the length equals the size, and the sizes are
#   ints CPython keeps one object of.
# - `parse`'s `len(key_bin) != _REQUIRED_LENGTH` weakened to `<`:
#   `stream.read(_REQUIRED_LENGTH)` never returns more.
#
# `bip32.py` from the same run, its second part: the root key from a
# seed and the reads of one half of a key from the other --
# `_xpub_from_xprv`, `xpub_from_xprv`, `prv_keyinfo_from_xprv` and
# `point_from_xpub` -- each survivor again run against the whole suite,
# which kills none of them outside tests/bip32.
# `prv_keyinfo_from_xprv`'s `key[:1]` widened to `key[:2]` in its "not a
# private key" refusal, and `point_from_xpub`'s `ec != ec2` turned into
# `is not`, die in tests/bip32/bip32_test.py: the first is now compared
# whole, the second given a copy of secp256k1, an equal curve that is
# another object. These operators are equivalent, where the paragraphs
# above have not named them:
#
# - `_xpub_from_xprv`'s and `prv_keyinfo_from_xprv`'s `key[0] != 0`
#   weakened to `> 0`: a byte is never below zero.
# - `prv_keyinfo_from_xprv`'s `key[1:]` widened to `key[0:]`, for the
#   reason the four reads above are: its `key[0] != 0` guard has
#   confirmed that byte is zero.
# - `_xpub_from_xprv`'s `check_validity=False` turned into `True`: every
#   caller hands it a key that has been validated, by
#   `key_data_from_bip32_key` or by the `_derive` of one, and the
#   neutered key of a valid xprv is valid, so the check passes.
# - `xpub_from_xprv`'s `b58encode(check_validity=False)` turned into
#   `True`: `xpub_from_xprv_` has validated the key it answers, so the
#   second check passes too.
#
# `bip32.py` from the same run, its last part: the derivations -- the
# working copy `_BIP32KeyData`, the public step, the account and range
# spellings -- and `crack_prv_key`, each survivor again run against the
# whole suite. `_assert_valid_branch`'s `branch > max_index` weakened to
# `>=` dies there, in tests/integer_policy_test.py, and now in
# tests/bip32 too. These die in tests/bip32/bip32_test.py:
# `_BIP32KeyData`'s `@dataclass(repr=False)` turned into `repr=True`,
# which would print the key and its scalar; the `max_index` default of
# `derive_from_account_`, `derive_from_account_range_` and
# `derive_from_account_range` moved by one, and the last one's
# `branches_0_1_only` default turned into `False`;
# `derive_from_account_range_`'s loop of output checks replaced with one
# over nothing, which a count of `assert_valid` calls sees; and
# `crack_prv_key`'s `parent_fingerprint != ...` weakened to `<`, which a
# wrong fingerprint above the parent's tells apart. These operators are
# equivalent, where the paragraphs above have not named them:
#
# - `_BIP32KeyData.is_private`'s and `crack_prv_key`'s `key[0] == 0` and
#   `!= 0` weakened to `<=` and `>`: a byte is never below zero.
# - `_derive`'s `key[1:]` widened to `key[0:]`, behind `is_private`, for
#   the reason the four reads above are; and its `else 0`, the scalar of
#   a public key, turned into 1 or -1: only the private derivation
#   reads the scalar, and it runs only for a private key.
# - `_pub_key_offset`'s and `crack_prv_key`'s `index.to_bytes(4, ...,
#   signed=False)` turned into `signed=True`: each is reached only past
#   a refusal of a hardened index, and below 2**31 both write the same
#   four bytes.
# - `pub_key_derivation_tweaks`' `secp256k1.p_size + 1` turned into `|`
#   or `^`: `p_size` is 32, and all three give 33.
# - `crack_prv_key`'s `c.depth != p.depth + 1` turned into `is not`: a
#   depth is at most 255, and the ints up to 256 are ones CPython keeps
#   one object of.
# - `derive_from_account_range`'s and `derive_from_account`'s
#   `b58encode(check_validity=False)` turned into `True`: the underscore
#   spelling each calls has validated the keys it answers.
# - `crack_prv_key`'s `check_validity=False` turned into `True`: the
#   `b58encode()` after it makes the same `assert_valid` on the same key,
#   so the check moves and refuses nothing more.

[cosmic-ray.distributor]
name = "local"
